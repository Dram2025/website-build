<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Connect dramdemo.com to Netlify</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0b0b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1a1b1d}
#stage{position:relative;width:1280px;height:720px}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;height:56px;background:#000;border-bottom:3px solid #f26a1b;display:flex;align-items:center;padding:0 24px;gap:16px;color:#fff}
#top b{font-size:18px;letter-spacing:.02em}
#top .step{margin-left:auto;background:#f26a1b;color:#000;font-weight:800;padding:6px 12px;border-radius:6px;font-size:15px}
#prog{position:absolute;left:0;top:56px;height:4px;background:#f26a1b;width:0;transition:width .6s}
/* browser */
#win{position:absolute;left:40px;top:84px;width:1200px;height:480px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:opacity .4s}
#bar{height:40px;background:#e9e9ec;display:flex;align-items:center;gap:8px;padding:0 14px}
#bar i{width:12px;height:12px;border-radius:50%;background:#c9c9cf;display:inline-block}
#url{margin-left:14px;flex:1;background:#fff;border-radius:6px;height:26px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#444}
#app{position:absolute;top:40px;left:0;right:0;bottom:0;overflow:hidden}
/* caption */
#cap{position:absolute;left:40px;right:40px;bottom:22px;min-height:118px;background:#fff;border-radius:12px;border-left:8px solid #f26a1b;padding:14px 22px;display:flex;flex-direction:column;justify-content:center}
#cap h2{margin:0 0 4px;font-size:26px;line-height:1.15}
#cap p{margin:0;font-size:19px;color:#3a3d42;line-height:1.35}
#note{position:absolute;right:46px;top:66px;font-size:11px;color:#8a8d92}
/* cursor */
#cur{position:absolute;left:640px;top:360px;width:28px;height:28px;z-index:50;transition:left .9s cubic-bezier(.5,0,.2,1),top .9s cubic-bezier(.5,0,.2,1);pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid #f26a1b;z-index:49;animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.hl{outline:4px solid #f26a1b !important;outline-offset:3px;border-radius:6px;transition:outline .2s}
/* full-screen title cards */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(900px 400px at 50% 0%,rgba(242,106,27,.25),transparent 70%),#0b0b0b;z-index:40;transition:opacity .5s}
.card h1{font-size:54px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.01em}
.card p{font-size:24px;color:#cfd2d6;margin:6px 0;max-width:900px}
.card .pill{display:inline-block;background:#f26a1b;color:#000;font-weight:800;padding:8px 16px;border-radius:999px;margin-top:18px;font-size:18px}
.card ol{text-align:left;font-size:24px;color:#e9e9e9;line-height:1.7}
/* generic app chrome */
.side{position:absolute;left:0;top:0;bottom:0;width:220px;background:#f4f5f7;border-right:1px solid #e1e3e6;padding:18px 14px;font-size:15px}
.side div{padding:9px 10px;border-radius:6px;color:#333;margin-bottom:2px}
.side .on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.main{position:absolute;left:220px;right:0;top:0;bottom:0;padding:24px 32px;overflow:hidden}
.main h3{margin:0 0 14px;font-size:24px}
.btn{display:inline-block;background:#1c7a74;color:#fff;border-radius:6px;padding:10px 18px;font-weight:700;font-size:15px}
.btn.alt{background:#fff;color:#222;border:1.5px solid #bbb}
.btn.blue{background:#116dff}
.inp{border:1.5px solid #b9bcc2;border-radius:6px;height:44px;padding:0 12px;display:flex;align-items:center;font-size:17px;width:460px;background:#fff}
.box{border:1px solid #e1e3e6;border-radius:10px;padding:16px 18px;margin-bottom:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:16px}
td,th{border-bottom:1px solid #e6e7ea;padding:10px 12px;text-align:left}
th{font-size:13px;text-transform:uppercase;color:#777;letter-spacing:.05em}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f2f4;padding:2px 6px;border-radius:4px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px}
.warnb{background:#fff4d6;color:#7a5600}
.okb{background:#dff5e7;color:#16713c}
.wixtop{height:54px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 22px;gap:18px;font-weight:700}
.wixtop .av{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#116dff;color:#fff;display:grid;place-items:center;font-size:14px}
.menu{position:absolute;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;font-size:15px;z-index:5}
.menu div{padding:9px 14px;border-radius:5px}
.dim{opacity:.45}
.danger{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid #d92d20;border-radius:14px;padding:26px 30px;width:760px;box-shadow:0 20px 60px rgba(0,0,0,.35);z-index:6}
.danger h4{margin:0 0 8px;font-size:26px;color:#b42318}
.phone{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:230px;height:400px;border-radius:30px;background:#111;padding:12px}
.phone .scr{width:100%;height:100%;border-radius:20px;overflow:hidden;background:#000;position:relative}
.phone img{width:100%;display:block}
</style></head>
<body>
<div id="stage">
  <div id="top"><b>D.RAM Demolition · Connect dramdemo.com to Netlify</b><span class="step" id="step">Intro</span></div>
  <div id="prog"></div>
  <div id="note">Illustration — the real screens may look slightly different</div>
  <div id="win"><div id="bar"><i></i><i></i><i></i><div id="url">app.netlify.com</div></div><div id="app"></div></div>
  <div id="cap"><h2 id="capH"></h2><p id="capP"></p></div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div id="cardHost"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const app=$('#app'), cur=$('#cur');
const TOTAL=9;
function step(n,label){$('#step').textContent=label;$('#prog').style.width=(n/TOTAL*100)+'%';}
function cap(h,p){$('#capH').textContent=h;$('#capP').innerHTML=p||'';}
function url(u){$('#url').textContent=u;}
async function card(html,ms){const c=document.createElement('div');c.className='card';c.innerHTML=html;$('#cardHost').appendChild(c);cur.style.opacity=0;await sleep(ms);c.style.opacity=0;await sleep(500);c.remove();cur.style.opacity=1;}
function center(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
async function move(sel,dx=0,dy=0){const el=typeof sel==='string'?app.querySelector(sel)||$(sel):sel;const [x,y]=center(el);cur.style.left=(x+dx-4)+'px';cur.style.top=(y+dy-2)+'px';await sleep(1000);return el;}
async function click(sel){const el=await move(sel);const r=document.createElement('div');r.className='ripple';r.style.left=cur.style.left.replace('px','')*1+4+'px';r.style.top=cur.style.top.replace('px','')*1+2+'px';$('#stage').appendChild(r);el.classList.add('hl');await sleep(650);r.remove();await sleep(250);el.classList.remove('hl');return el;}
async function hl(sel,ms=1800){const el=app.querySelector(sel);el.classList.add('hl');await sleep(ms);el.classList.remove('hl');}
async function type(sel,text,speed=70){const el=app.querySelector(sel);el.textContent='';for(const ch of text){el.textContent+=ch;await sleep(speed);}}

const netSide=on=>`<div class="side">${['Site overview','Deploys','Logs','Forms','Domain management','Site configuration'].map(x=>`<div class="${x===on?'on':''}" id="s-${x.split(' ')[0].toLowerCase()}">${x}</div>`).join('')}</div>`;

async function run(){
  // ── INTRO ───────────────────────────────────────────────
  step(0,'Intro');
  await card(`<h1>Connect your Wix domain to Netlify</h1><p>Point <b>dramdemo.com</b> at your new website — about 15 minutes of clicking.</p><p>Your domain <b>stays registered with Wix</b>. You only change two settings.</p><span class="pill">3 steps</span>`,4200);
  await card(`<h1>What you'll do</h1><ol><li><b>Netlify:</b> add <code style="color:#000">www.dramdemo.com</code> to your site</li><li><b>Wix:</b> change two DNS records to point at Netlify</li><li><b>Wait &amp; check:</b> verify, then test on your phone</li></ol><p style="font-size:19px">Before you start: your site must already be on Netlify (you have a <b>…netlify.app</b> link).</p>`,6500);

  // ── STEP 1: NETLIFY ─────────────────────────────────────
  step(1,'Step 1 · Netlify');
  url('app.netlify.com/sites/dram-demolition/overview');
  app.innerHTML=netSide('Site overview')+`<div class="main"><h3>dram-demolition</h3><div class="box"><b>Production deploy</b> <span class="badge okb">Published</span><p style="margin:8px 0 0;color:#555">https://dram-demolition.netlify.app</p></div><div class="box" style="color:#666">Set up a custom domain to use your own address.</div></div>`;
  cap('Step 1 — Open your site in Netlify','Log in at <b>app.netlify.com</b> and click your site. Then open <b>Domain management</b> in the left menu.');
  await sleep(1600); await click('#s-domain');
  url('app.netlify.com/sites/dram-demolition/domain-management');
  app.innerHTML=netSide('Domain management')+`<div class="main"><h3>Domain management</h3><div class="box"><b>Production domains</b><p style="color:#666;margin:8px 0 14px">dram-demolition.netlify.app <span class="badge okb">Default</span></p><span class="btn" id="add">Add a domain</span></div></div>`;
  await sleep(700); cap('Click “Add a domain”','This tells Netlify you own a domain you want to use.');
  await click('#add');
  app.innerHTML=netSide('Domain management')+`<div class="main"><h3>Add a domain you already own</h3><p style="color:#555">Domain</p><div class="inp" id="dom"></div><div style="margin-top:16px"><span class="btn" id="ver">Verify</span></div></div>`;
  cap('Type www.dramdemo.com — with the “www”','The website is set up to use <b>www</b> as its main address. Netlify adds <b>dramdemo.com</b> automatically and forwards it.');
  await move('#dom'); await type('#dom','www.dramdemo.com',90); await sleep(500); await click('#ver');
  app.querySelector('.main').insertAdjacentHTML('beforeend',`<div class="box" style="margin-top:18px" id="owned"><b>www.dramdemo.com</b> is registered with another provider. <span class="badge warnb">You own it</span><div style="margin-top:12px"><span class="btn" id="adddom">Add domain</span></div></div>`);
  await sleep(900); cap('Click “Add domain”','Netlify notices the domain is registered with Wix. That’s expected — click <b>Add domain</b>.');
  await click('#adddom');
  app.innerHTML=netSide('Domain management')+`<div class="main"><h3>Domain management</h3><div class="box"><b>www.dramdemo.com</b> <span class="badge okb">Primary</span> <span class="badge warnb">Awaiting External DNS</span><br><span style="color:#666">dramdemo.com — redirects automatically to www.dramdemo.com</span></div><div class="box" id="recs"><b>Point your domain to Netlify — add these records at your DNS provider (Wix):</b><table style="margin-top:8px"><tr><th>Type</th><th>Host / Name</th><th>Value</th></tr><tr id="ra"><td><b>A</b></td><td>@ &nbsp;(dramdemo.com)</td><td><code>75.2.60.5</code></td></tr><tr id="rc"><td><b>CNAME</b></td><td>www</td><td><code>dram-demolition.netlify.app</code></td></tr></table></div></div>`;
  cap('Netlify now shows the two records you need','<b>Write these down</b> (or keep this tab open). Use the exact values <b>your</b> screen shows — the CNAME value is your own site’s .netlify.app address.');
  await sleep(1200); await hl('#ra',2600); await hl('#rc',2600); await sleep(800);

  // ── STEP 2: WIX ─────────────────────────────────────────
  step(2,'Step 2 · Wix');
  await card(`<h1>Step 2 — Wix</h1><p>Open a new tab and log in to <b>wix.com</b>.</p>`,2600);
  url('manage.wix.com/account/domains');
  app.innerHTML=`<div class="wixtop">Wix <span style="font-weight:400;color:#666">My Sites</span><span class="av" id="av">D</span></div><div style="padding:26px 34px"><h3 style="margin:0 0 16px;font-size:24px">Domains</h3><div class="box" style="display:flex;align-items:center;gap:16px"><b style="font-size:18px">dramdemo.com</b><span class="badge okb">Active</span><span style="color:#777">Renews automatically</span><span style="margin-left:auto;font-size:24px;padding:0 10px;border-radius:6px" id="dots">⋯</span></div></div>`;
  cap('Go to Domains','Click your profile picture (top right) → <b>Domains</b>. Find <b>dramdemo.com</b>.');
  await sleep(1500); await click('#av'); await sleep(400);
  cap('Click the ⋯ next to dramdemo.com','Then choose <b>Manage DNS Records</b>.');
  await click('#dots');
  app.insertAdjacentHTML('beforeend',`<div class="menu" style="right:60px;top:150px"><div>Assign to a different site</div><div id="mdns" style="font-weight:700">Manage DNS Records</div><div>Transfer away from Wix</div></div>`);
  await sleep(400); await click('#mdns');
  url('manage.wix.com/dns/dramdemo.com/records');
  const dnsPage=(aVal,cVal,editing)=>`<div class="wixtop">Wix <span style="font-weight:400;color:#666">DNS Records · dramdemo.com</span><span class="btn blue" id="save" style="margin-left:auto;padding:7px 18px">Save</span><span class="av" style="margin-left:0">D</span></div><div style="padding:16px 34px">
    <div class="box" id="boxA" style="padding:10px 16px"><b>A (Host)</b><table><tr><th>Host name</th><th>Value</th><th></th></tr><tr><td>dramdemo.com</td><td id="aval">${aVal}</td><td><span class="btn alt" id="editA" style="padding:5px 12px">Edit</span></td></tr></table></div>
    <div class="box" id="boxC" style="padding:10px 16px"><b>CNAME (Aliases)</b><table><tr><th>Host name</th><th>Value</th><th></th></tr><tr><td>www.dramdemo.com</td><td id="cval">${cVal}</td><td><span class="btn alt" id="editC" style="padding:5px 12px">Edit</span></td></tr></table></div>
    <div class="box dim" id="boxMX" style="padding:10px 16px"><b>MX (Mail exchange) &amp; TXT</b> — <i>email settings</i></div>
    </div>`;
  app.innerHTML=dnsPage('<span style="color:#777">(current Wix address)</span>','<span style="color:#777">(current Wix address)</span>');
  cap('This is where your domain points','Right now both records point to Wix. You’ll change <b>only these two</b>.');
  await sleep(2600);
  cap('Edit the A record','Click <b>Edit</b> on the A record and replace the value with <b>75.2.60.5</b>. If there’s a second A record, delete it so only one remains.');
  await click('#editA'); app.querySelector('#aval').innerHTML='<span class="inp" style="width:300px;height:36px" id="ain"></span>';
  await move('#ain'); await type('#ain','75.2.60.5',110); await sleep(700);
  cap('Edit the www CNAME record','Click <b>Edit</b> on <b>www</b> and set the value to <b>your-site.netlify.app</b> (the exact address Netlify showed you).');
  await click('#editC'); app.querySelector('#cval').innerHTML='<span class="inp" style="width:330px;height:36px" id="cin"></span>';
  await move('#cin'); await type('#cin','dram-demolition.netlify.app',70); await sleep(700);
  // email warning
  app.querySelector('#boxMX').classList.remove('dim');
  cap('⚠️ Do NOT touch the MX or TXT records','Those run your <b>david@dramdemo.com</b> email. Leave them exactly as they are.');
  await hl('#boxMX',3200);
  cap('Click Save','Confirm if Wix asks. That’s all the Wix changes.');
  await click('#save');
  app.querySelector('#aval').innerHTML='<code>75.2.60.5</code> <span class="badge okb">Saved</span>';
  app.querySelector('#cval').innerHTML='<code>dram-demolition.netlify.app</code> <span class="badge okb">Saved</span>';
  await sleep(2400);

  // ── STEP 2b: locked records ─────────────────────────────
  step(3,'If Wix won’t let you edit');
  app.insertAdjacentHTML('beforeend',`<div class="danger"><h4>Can’t edit those records?</h4><p style="font-size:18px;margin:0;line-height:1.5">That means the domain is still attached to a Wix site.<br>Go back to <b>Domains → ⋯</b> and choose the option to <b>disconnect / unassign it from the site</b>, then edit the records again.<br><br>Stuck? Send Claude a screenshot.</p></div>`);
  cap('Only if the Edit buttons are greyed out','Disconnect the domain from your Wix site first. Your domain registration and email are not affected.');
  await sleep(6000);

  // ── STEP 3: WAIT & VERIFY ───────────────────────────────
  step(4,'Step 3 · Wait & check');
  await card(`<h1>Step 3 — Wait &amp; check</h1><p>DNS changes usually take <b>30 minutes to a few hours</b> (rarely up to 48).</p><span class="pill">☕ Go do something else</span>`,4200);
  url('app.netlify.com/sites/dram-demolition/domain-management');
  app.innerHTML=netSide('Domain management')+`<div class="main"><h3>Domain management</h3><div class="box"><b>www.dramdemo.com</b> <span class="badge okb">Primary</span> <span class="badge warnb" id="st">Awaiting External DNS</span><div style="margin-top:12px"><span class="btn alt" id="vdns">Verify DNS configuration</span></div></div><div class="box"><b>HTTPS</b><p style="margin:6px 0 0;color:#666" id="ssl">Waiting on DNS propagation</p></div></div>`;
  step(5,'Step 3 · Verify');
  cap('Back in Netlify: click “Verify DNS configuration”','If it still says “awaiting”, wait a bit longer and try again.');
  await sleep(1200); await click('#vdns');
  app.querySelector('#st').className='badge okb'; app.querySelector('#st').textContent='✓ Netlify DNS check passed';
  await sleep(1200);
  step(6,'Step 3 · HTTPS');
  app.querySelector('#ssl').innerHTML='<span class="badge okb">🔒 Certificate active</span> &nbsp;Your site is secured with HTTPS';
  cap('HTTPS turns on by itself','Netlify adds the padlock 🔒 automatically, usually within an hour of the DNS check passing.');
  await hl('#ssl',3000);

  step(7,'Step 3 · Test on your phone');
  url('www.dramdemo.com');
  app.innerHTML=`<div style="position:absolute;inset:0;background:#f4f5f7"></div><div class="phone"><div class="scr"><img src="hero.png" alt=""></div></div>`;
  cap('Test on your phone — using cellular data, not Wi-Fi','Open <b>dramdemo.com</b>. You should land on <b>www.dramdemo.com</b> with your new site. Then send yourself a test estimate.');
  await sleep(6500);

  // ── AFTER ───────────────────────────────────────────────
  step(9,'Done');
  await card(`<h1>You’re live 🎉</h1><ol><li>Keep paying the <b>Wix domain renewal</b> (and email, if it’s through Wix)</li><li>You can cancel or downgrade the <b>Wix website plan</b></li><li>Changes from now on: just ask Claude</li></ol><span class="pill">D.RAM Demolition · 714-872-6566</span>`,7000);
  window.__done=true;
}
window.addEventListener('load',()=>setTimeout(run,400));
</script>
</body></html>
